[project]
name = "xomtra-workspace"
version = "0.0.0"
description = "xomtra development workspace (not published)"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = ["hacore", "xomtra-ingest", "xomtra-mcp"]

[dependency-groups]
dev = [
  "import-linter>=2.17",
  "mypy>=1.18",
  "pytest>=8.4",
  "pytest-asyncio>=1.2",
  "pytest-cov>=7.0",
  "ruff>=0.14",
]

[tool.uv]
package = false

# SQLMesh still declares duckdb<2; the lake runs on DuckDB 2 (DuckLake catalog format
# of the deployed stack). The SQLMesh integration test in services/ingest guards this
# override (ADR 031).
override-dependencies = ["duckdb>=2.0"]

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
hacore = { workspace = true }
xomtra-ingest = { workspace = true }
xomtra-mcp = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF", "PT", "C4", "PL", "TRY", "N",
]
ignore = [
  "TRY003",   # long messages in exceptions are fine
  "PLR2004",  # magic values in comparisons
  "PLR0913",  # many arguments in constructors
]

[tool.ruff.lint.isort]
known-first-party = ["hacore", "xomtra_ingest", "xomtra_mcp"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S104", "S105", "S106", "S608", "PLR2004", "PLC0415", "ASYNC109", "ASYNC110"]
# SQL built from internal identifiers (schema/table constants) and values quoted with
# hacore.lake.sql_literal; DuckDB cannot bind identifiers or ATTACH/read_json options.
"packages/hacore/src/hacore/{bronze,maintenance,catalog,correlations,weather,findings}.py" = ["S608"]
# Internal view/column names only; values are bound or quoted, user SQL passes the guard.
"services/mcp-server/src/xomtra_mcp/{data.py,admin/status.py,tokens.py,access.py}" = ["S608"]

[tool.mypy]
python_version = "3.13"
strict = true
files = [
  "packages/hacore/src", "services/mcp-server/src", "services/ingest/src", "scripts/release.py",
]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["duckdb.*", "psycopg2.*", "yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = [
  "packages/hacore/tests", "services/mcp-server/tests", "services/ingest/tests", "scripts/tests",
]
addopts = "--import-mode=importlib -ra"
markers = ["contract: needs a real Home Assistant (XOMTRA_CONTRACT_HA_URL)"]

[tool.coverage.run]
source = ["hacore", "xomtra_ingest", "xomtra_mcp"]
branch = true

# Boundaries between the domain-neutral core and the Home Assistant part (ADR 089, P0).
# The listed modules already respect them; more join as the code is split (M3-M7 of
# the plugin preparation). `uv run lint-imports` checks them in CI.
[tool.importlinter]
root_packages = ["hacore", "xomtra_mcp", "xomtra_ingest"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The core library does not depend on the services"
type = "forbidden"
source_modules = ["hacore"]
forbidden_modules = ["xomtra_mcp", "xomtra_ingest"]

[[tool.importlinter.contracts]]
name = "The MCP server and the ingest service are independent"
type = "independence"
modules = ["xomtra_mcp", "xomtra_ingest"]

[[tool.importlinter.contracts]]
name = "Domain-neutral modules do not depend on Home Assistant modules"
type = "forbidden"
source_modules = [
  "hacore.significance",
  "hacore.context",
  "hacore.confidence",
  "hacore.usefulness",
  "hacore.analysis_settings",
  "hacore.lake",
  "hacore.edition",
  "hacore.secretstore",
]
forbidden_modules = [
  "hacore.client",
  "hacore.history",
  "hacore.registry",
  "hacore.stream",
  "hacore.ingest",
  "hacore.bronze",
  "hacore.ha_connection",
  "hacore.onboarding",
  "hacore.testing",
  "hacore.areas",
  "hacore.exclusions",
  "hacore.actionability",
]

[[tool.importlinter.contracts]]
name = "The analysis engine is pure computation (no lake, database or network)"
type = "forbidden"
source_modules = [
  "hacore.significance",
  "hacore.context",
  "hacore.confidence",
  "hacore.usefulness",
  "hacore.analysis_settings",
]
forbidden_modules = ["hacore.lake", "duckdb", "psycopg2", "httpx", "aiohttp", "websockets"]
