name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Everything is read-only unless a job asks for more.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Renovate keeps the digest current (see renovate.json).
  TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
  UV_VERSION: "0.13.9"
  # Home Assistant versions of the contract tests: current and previous stable release.
  # Renovate keeps both current (see renovate.json).
  HA_IMAGE_CURRENT: homeassistant/home-assistant:2026.11.2@sha256:493a07e8f6530fc640223f4a0a5248f20a61ca2f718bb1d31efbf08a2c5ea28f
  HA_IMAGE_PREVIOUS: homeassistant/home-assistant:2026.10.4@sha256:23f4dfbb69ce76315dbc4de7915504f1c2dcecd7ca2648113a493a385972e133

jobs:
  lint:
    name: lint
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: test
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest --cov --cov-report=term-missing

  contract:
    name: contract (HA ${{ matrix.ha }})
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        ha: [current, previous]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - name: Start Home Assistant
        env:
          HA_IMAGE: ${{ matrix.ha == 'current' && env.HA_IMAGE_CURRENT || env.HA_IMAGE_PREVIOUS }}
        run: |
          cp -r packages/hacore/tests/contract/ha-config "$RUNNER_TEMP/ha-config"
          docker run -d --name ha -p 127.0.0.1:8123:8123 \
            -v "$RUNNER_TEMP/ha-config:/config" "$HA_IMAGE"
      - name: Contract tests (onboarding, non-admin token, history, statistics, ingest, HA login)
        env:
          HAMMOND_CONTRACT_HA_URL: http://127.0.0.1:8123
          HAMMOND_CONTRACT_HA_CONFIG: ${{ runner.temp }}/ha-config
        run: uv run pytest packages/hacore/tests/contract -m contract
      - name: Home Assistant log on failure
        if: failure()
        run: docker logs ha 2>&1 | tail -200

  trivy:
    name: trivy
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan repository (dependencies, secrets, misconfiguration) to SARIF
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" fs \
            --scanners vuln,secret,misconfig --format sarif --output trivy-fs.sarif \
            --exit-code 0 .
      - name: Upload SARIF
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      - name: Fail on high or critical findings
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" fs \
            --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 .

  build:
    name: build
    needs: [lint, test]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      HAMMOND_MCP_IMAGE: hammond-mcp:ci
      HAMMOND_INGEST_IMAGE: hammond-ingest:ci
      POSTGRES_PASSWORD: ci-postgres
      DUCKLAKE_PG_PASSWORD: ci-ducklake
      OPS_PG_PASSWORD: ci-ops-'quote
      AUDIT_PG_PASSWORD: ci-audit-'quote
      AUDIT_ADMIN_PG_PASSWORD: ci-audit-admin
      HAMMOND_ADMIN_SESSION_KEY: ci-dummy-admin-session-key-at-least-32-chars
      ADMIN_CIDR: 192.0.2.0/24
      HAMMOND_HA_URL: http://ha:8123
      S3_ACCESS_KEY: ci-access
      S3_SECRET_KEY: ci-secret-key
      # Dummy Entra values: the server must start and serve OAuth metadata.
      HAMMOND_BASE_URL: http://127.0.0.1:8000
      HAMMOND_ENTRA_TENANT_ID: 00000000-0000-0000-0000-000000000001
      HAMMOND_ENTRA_CLIENT_ID: 00000000-0000-0000-0000-000000000002
      HAMMOND_ENTRA_CLIENT_SECRET: ci-dummy
      HAMMOND_JWT_SIGNING_KEY: ci-dummy-signing-key-at-least-32-characters
      # Caddy is not started in CI (needs a real DNS zone), but compose must render.
      HAMMOND_PUBLIC_HOST: mcp.example.org
      ACME_EMAIL: ci@example.org
      CLOUDFLARE_API_TOKEN: ci-dummy
      CLAUDE_IP_RANGES: 192.0.2.0/24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build MCP image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/mcp-server/Dockerfile
          load: true
          push: false
          tags: hammond-mcp:ci
          cache-from: type=gha,scope=hammond-mcp
          cache-to: type=gha,mode=max,scope=hammond-mcp
      - name: Build ingest image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/ingest/Dockerfile
          load: true
          push: false
          tags: hammond-ingest:ci
          cache-from: type=gha,scope=hammond-ingest
          cache-to: type=gha,mode=max,scope=hammond-ingest
      - name: Build Caddy image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/caddy
          load: true
          push: false
          tags: hammond-caddy:ci
          cache-from: type=gha,scope=hammond-caddy
          cache-to: type=gha,mode=max,scope=hammond-caddy
      - name: Scan images
        run: |
          for image in hammond-mcp:ci hammond-ingest:ci hammond-caddy:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done
      - name: Validate Caddyfile (with the runtime hardening of compose.yaml)
        # cap_drop ALL + no-new-privileges: exec fails with EPERM if the binary carries
        # file capabilities, which the plain `docker run` default would hide.
        run: |
          docker run --rm --cap-drop ALL --security-opt no-new-privileges --read-only \
            -e HAMMOND_PUBLIC_HOST -e ACME_EMAIL -e CLAUDE_IP_RANGES -e ADMIN_CIDR \
            hammond-caddy:ci caddy adapt --config /etc/caddy/Caddyfile >/dev/null
          # Local access mode (ADR 056): own CA, LAN only.
          docker run --rm --cap-drop ALL --security-opt no-new-privileges --read-only \
            -e HAMMOND_LOCAL_HOST=hammond.lan -e LAN_CIDR=192.168.0.0/16 -e ADMIN_CIDR \
            hammond-caddy:ci caddy adapt --config /etc/caddy/Caddyfile.local >/dev/null
          # The start script refuses incomplete settings with a clear message.
          if out=$(docker run --rm -e HAMMOND_ACCESS_MODE=local hammond-caddy:ci 2>&1); then
            echo "started without HAMMOND_LOCAL_HOST"; exit 1
          fi
          echo "$out" | grep -q "requires HAMMOND_LOCAL_HOST"
      - name: Smoke test compose stack (Postgres + SeaweedFS + DuckLake + MCP)
        working-directory: deploy/compose
        run: |
          docker compose up -d --wait --wait-timeout 180 mcp
          docker compose logs ducklake-init
          docker compose exec -T mcp python -c "import urllib.request as u; print(u.urlopen('http://127.0.0.1:8000/healthz').read())"
          docker compose exec -T mcp python - <<'PY'
          import urllib.request, urllib.error
          req = urllib.request.Request("http://127.0.0.1:8000/mcp", method="POST", data=b"{}")
          try:
              urllib.request.urlopen(req)
              raise SystemExit("MCP endpoint answered without a token")
          except urllib.error.HTTPError as err:
              assert err.code == 401, err.code
          print(urllib.request.urlopen("http://127.0.0.1:8000/.well-known/oauth-protected-resource/mcp").read())
          PY
      - name: Smoke test lite lake (Postgres catalog + local data files, ADR 050)
        working-directory: deploy/compose
        run: |
          docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U postgres \
            -c "CREATE DATABASE ducklake_lite OWNER ducklake"
          # No object storage: no HAMMOND_S3_* values at all. `docker compose run` has
          # no --tmpfs, so the image runs directly on the compose backend network.
          set -o pipefail
          docker run --rm --network hammond_backend --read-only --cap-drop ALL \
            --tmpfs /data:uid=10001,gid=10001 \
            -e HAMMOND_EDITION=lite -e HAMMOND_LAKE_PG_HOST=postgres \
            -e HAMMOND_LAKE_PG_DB=ducklake_lite -e HAMMOND_LAKE_PG_USER=ducklake \
            -e HAMMOND_LAKE_PG_PASSWORD="$DUCKLAKE_PG_PASSWORD" \
            -e HAMMOND_LAKE_DATA_PATH=/data/lake \
            --entrypoint python "$HAMMOND_MCP_IMAGE" -m hacore.lake init 2>&1 \
            | tee /tmp/lite-lake.log
          grep -q "data files in local data path" /tmp/lite-lake.log
      - name: Smoke test ingest (HA -> stream/backfill -> bronze -> SQLMesh silver)
        working-directory: deploy/compose
        run: |
          # Creates the egress network (and the ingest containers, started below).
          docker compose up --no-start ingest-stream dagster-daemon dagster-webserver
          docker run -d --name ha --network hammond_egress \
            -v "$GITHUB_WORKSPACE/packages/hacore/tests/contract/ha-config:/config" \
            "$HA_IMAGE_CURRENT"
          HAMMOND_HA_TOKEN=$(docker compose run --rm --no-deps -T ingest-stream \
            python -c "from hacore.onboarding import onboard; print(onboard('http://ha:8123').user_token)" \
            | tail -n 1)
          export HAMMOND_HA_TOKEN
          echo "::add-mask::$HAMMOND_HA_TOKEN"
          docker compose up -d --wait --wait-timeout 240 ingest-stream dagster-daemon dagster-webserver
          docker compose exec -T dagster-daemon hammond-ingest sync
          docker compose exec -T dagster-daemon hammond-ingest backfill --start 1d
          # Through Dagster (Postgres run storage, read-only image): retention + maintenance.
          docker compose exec -T dagster-daemon dagster job execute \
            -m hammond_ingest.definitions -a defs -j retention_daily
          docker compose exec -T dagster-daemon python - <<'PY'
          from hacore import lake
          con = lake.connect(lake.LakeSettings.from_env())
          for table in ("bronze.ha_states", "bronze.ha_registry", "silver.entities"):
              (n,) = con.execute(f"SELECT count(*) FROM lake.{table}").fetchone()
              print(table, n)
              assert n > 0, table
          # silver.states holds complete hours only; HA may have started in the current hour.
          (complete,) = con.execute(
              "SELECT count(*) FROM lake.bronze.ha_states "
              "WHERE last_updated < date_trunc('hour', now())"
          ).fetchone()
          (silver,) = con.execute("SELECT count(*) FROM lake.silver.states").fetchone()
          print("bronze states in complete hours", complete, "silver.states", silver)
          assert silver > 0 or complete == 0, "silver.states"
          PY
      - name: Smoke test catalog and MCP data tools (policy, SQL guard, lockdown, audit)
        working-directory: deploy/compose
        run: |
          docker compose exec -T dagster-daemon hammond-ingest catalog
          # A record past the audit retention (default 90 days) must be purged on first write.
          docker compose exec -T postgres psql -U postgres -d audit -c \
            "INSERT INTO audit.tool_call (ts, tool, decision, outcome) VALUES (now() - interval '100 days', 'ci-old', 'allowed', 'ok')"
          # The MCP container runs the real lockdown (read-only DuckLake on Postgres +
          # SeaweedFS, external access off) and writes to the INSERT-only audit role.
          docker compose exec -T mcp python - <<'PY'
          import asyncio
          from hacore.lake import LakeSettings
          from hammond_mcp.audit import AuditRecord, PostgresAuditSink
          from hammond_mcp.config import Settings
          from hammond_mcp.data import KNOWN_VIEWS, DataAccess
          from hammond_mcp.identity import Identity
          from hammond_mcp.policy import Policy
          from hammond_mcp.sqlguard import SQLRejected

          data = DataAccess.from_settings(LakeSettings.from_env())
          policy = Policy.load()
          admin = policy.access_for(Identity(True, "ci", roles=("HAmmond.Admin",)), KNOWN_VIEWS)
          reader = policy.access_for(Identity(True, "ci", roles=("HAmmond.Reader",)), KNOWN_VIEWS)
          found = data.search_catalog(admin)
          print("catalog entities", found["row_count"])
          assert found["row_count"] > 0
          entity = found["entities"][0]["entity_id"]
          print(data.describe_entity(admin, entity)["entity"]["kind"])
          res = data.query_sql(reader, "SELECT domain, count(*) n FROM states GROUP BY ALL")
          print(res["rows"])
          assert not any(r["domain"] in ("person", "device_tracker") for r in res["rows"])
          for bad in ("SELECT * FROM read_csv('/etc/passwd')", "SELECT * FROM lake.bronze.ha_states"):
              try:
                  data.query_sql(admin, bad)
                  raise SystemExit(f"accepted: {bad}")
              except SQLRejected:
                  pass
          con = data._con.cursor()
          for bad in ("SELECT * FROM read_text('/etc/passwd')", "SET enable_external_access = true"):
              try:
                  con.execute(bad)
                  raise SystemExit(f"engine accepted: {bad}")
              except Exception as err:
                  print("engine refused:", type(err).__name__)
          sink = PostgresAuditSink(Settings().audit_dsn)
          asyncio.run(sink.write(AuditRecord(tool="ci", decision="allowed", outcome="ok", idp="token")))
          PY
          docker compose exec -T postgres psql -U postgres -d audit -tAc \
            "SELECT count(*) FROM audit.tool_call WHERE tool = 'ci' AND idp = 'token'" | grep -qx 1
      - name: Smoke test personal tokens (ADR 059 grants)
        working-directory: deploy/compose
        run: |
          # sha256('hmd_ci_token') stored by the superuser; the MCP role may only verify.
          docker compose exec -T postgres psql -U postgres -d audit -c \
            "INSERT INTO access.token (id, token_hash, owner, description, role) VALUES ('ci', sha256('hmd_ci_token'), 'ci', 'ci', 'HAmmond.Reader')"
          docker compose exec -T mcp python - <<'PY'
          from hammond_mcp.config import Settings
          from hammond_mcp.tokens import PostgresTokenStore, TokenStoreError, token_hash

          store = PostgresTokenStore(Settings().audit_dsn)
          info = store.verify(token_hash("hmd_ci_token"))
          assert info is not None and info.role == "HAmmond.Reader", info
          assert store.verify(token_hash("hmd_ci_wrong")) is None
          for forbidden in (store.list, lambda: store.revoke("ci", "x")):
              try:
                  forbidden()
                  raise SystemExit("MCP role may list or revoke tokens")
              except TokenStoreError:
                  pass
          print("token grants ok")
          PY
          docker compose exec -T postgres psql -U postgres -d audit -tAc \
            "SELECT last_used_at IS NOT NULL FROM access.token WHERE id = 'ci'" | grep -qx t
          docker compose exec -T postgres psql -U postgres -d audit -tAc \
            "SELECT count(*) FROM audit.tool_call WHERE tool = 'ci-old'" | grep -qx 0
      - name: Smoke test admin GUI (sign-in required, Dagster UI under /admin/dagster)
        working-directory: deploy/compose
        run: |
          docker compose up -d --wait --wait-timeout 120 admin
          docker compose exec -T admin python - <<'PY'
          import urllib.error, urllib.request

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          opener = urllib.request.build_opener(NoRedirect)
          for path, code, target in [
              ("/admin/", 303, "/admin/login"),
              ("/admin/auth/check", 302, "/admin/login"),
              ("/admin/login", 303, "login.microsoftonline.com"),
          ]:
              try:
                  opener.open("http://127.0.0.1:8100" + path)
                  raise SystemExit(f"{path} answered without sign-in")
              except urllib.error.HTTPError as err:
                  assert err.code == code, (path, err.code)
                  assert target in err.headers["location"], (path, err.headers["location"])
          print(urllib.request.urlopen("http://dagster-webserver:3000/admin/dagster/server_info").read())
          PY
      - name: Compose logs on failure
        if: failure()
        working-directory: deploy/compose
        run: docker compose logs --no-color || true

  # Every commit of main gets signed images tagged main and sha-<commit>. Releases do not
  # rebuild: release.yml promotes these images to the version tags (ADR 045).
  publish:
    name: publish (${{ matrix.image }})
    needs: [build, trivy, contract]
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        include:
          - image: hammond-mcp
            context: .
            file: services/mcp-server/Dockerfile
          - image: hammond-ingest
            context: .
            file: services/ingest/Dockerfile
          - image: hammond-caddy
            context: deploy/caddy
            file: deploy/caddy/Dockerfile
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless cosign signing + provenance attestation
      attestations: write
    env:
      IMAGE: ghcr.io/zettabyte-cz/${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=long
      - id: push
        name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          sbom: true
          provenance: mode=max
      - name: Sign image (cosign keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
