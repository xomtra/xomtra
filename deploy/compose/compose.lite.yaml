# Lite edition (ADR 050) as an override of compose.yaml: no SeaweedFS and no Dagster.
# The lake keeps its catalog in Postgres and its data files in the volume lake-data;
# one `worker` container runs the live stream and the scheduled jobs.
#
#   docker compose -f compose.yaml -f compose.lite.yaml up -d
#
# Services of the full edition are put into the profile "full" and do not start.
# init-env.sh still generates the S3 keys of the full edition; they are not used here.

x-lite-env: &lite-env
  XOMTRA_EDITION: lite
  XOMTRA_LAKE_DATA_PATH: /lake
  XOMTRA_STATES_RETENTION_DAYS: ${XOMTRA_STATES_RETENTION_DAYS:-90}
  XOMTRA_STATISTICS_5MIN_RETENTION_DAYS: ${XOMTRA_STATISTICS_5MIN_RETENTION_DAYS:-90}
  XOMTRA_STATISTICS_HOUR_RETENTION_DAYS: ${XOMTRA_STATISTICS_HOUR_RETENTION_DAYS:-1825}

services:
  seaweedfs:
    profiles: [full]
  seaweedfs-init:
    profiles: [full]
  ingest-stream:
    profiles: [full]
  dagster-daemon:
    profiles: [full]
  dagster-webserver:
    profiles: [full]

  ducklake-init:
    environment: *lite-env
    volumes:
      - lake-data:/lake
    depends_on: !override
      postgres-init: { condition: service_completed_successfully }

  mcp:
    environment: *lite-env
    volumes:
      - lake-data:/lake:ro

  admin:
    environment: *lite-env
    volumes:
      - lake-data:/lake:ro

  # Live stream + scheduled jobs in one process (xomtra-ingest worker).
  worker:
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    image: ${XOMTRA_INGEST_IMAGE:-ghcr.io/xomtra/xomtra-ingest:0.4.1}
    command: ["xomtra-ingest", "worker"]
    environment:
      XOMTRA_LAKE_PG_HOST: postgres
      XOMTRA_LAKE_PG_DB: ${DUCKLAKE_PG_DB:-ducklake}
      XOMTRA_LAKE_PG_USER: ${DUCKLAKE_PG_USER:-ducklake}
      XOMTRA_LAKE_PG_PASSWORD: ${DUCKLAKE_PG_PASSWORD:?set DUCKLAKE_PG_PASSWORD in .env}
      XOMTRA_OPS_PG_HOST: postgres
      XOMTRA_OPS_PG_USER: ${OPS_PG_USER:-xomtra_ops}
      XOMTRA_OPS_PG_PASSWORD: ${OPS_PG_PASSWORD:?set OPS_PG_PASSWORD in .env}
      XOMTRA_SQLMESH_PG_DB: ${SQLMESH_PG_DB:-sqlmesh}
      XOMTRA_WORKER_PG_DB: ${WORKER_PG_DB:-ops}
      XOMTRA_ANALYSIS_SETTINGS_DB: ${AUDIT_PG_DB:-audit}
      XOMTRA_HA_URL: ${XOMTRA_HA_URL:-}
      XOMTRA_HA_TOKEN: ${XOMTRA_HA_TOKEN:-}
      XOMTRA_TIMEZONE: ${XOMTRA_TIMEZONE:-UTC}
      XOMTRA_CATALOG_WINDOW_DAYS: ${XOMTRA_CATALOG_WINDOW_DAYS:-30}
      XOMTRA_LABEL_NO_INGEST: ${XOMTRA_LABEL_NO_INGEST:-xomtra_no_ingest}
      XOMTRA_LABEL_NO_ANALYSIS: ${XOMTRA_LABEL_NO_ANALYSIS:-xomtra_no_analysis}
      XOMTRA_CORRELATION_OUTSIDE_TEMP: ${XOMTRA_CORRELATION_OUTSIDE_TEMP:-}
      XOMTRA_CORRELATION_WINDOWS_DAYS: ${XOMTRA_CORRELATION_WINDOWS_DAYS:-[365, 30]}
      XOMTRA_OPEN_METEO_ENABLED: ${XOMTRA_OPEN_METEO_ENABLED:-false}
      XOMTRA_ANOMALIES_ENABLED: ${XOMTRA_ANOMALIES_ENABLED:-true}
      XOMTRA_ANOMALY_Z: ${XOMTRA_ANOMALY_Z:-4.0}
      XOMTRA_DUCKDB_MEMORY_LIMIT: ${XOMTRA_WORKER_DUCKDB_MEMORY_LIMIT:-512MB}
      XOMTRA_DUCKDB_THREADS: ${XOMTRA_DUCKDB_THREADS:-2}
      XOMTRA_DUCKDB_TEMP_DIR: /data/duckdb-tmp
      XOMTRA_DUCKDB_MAX_TEMP_SIZE: ${XOMTRA_DUCKDB_MAX_TEMP_SIZE:-8GB}
      <<: *lite-env
    mem_limit: ${XOMTRA_WORKER_MEM_LIMIT:-1536m}
    volumes:
      - lake-data:/lake
      - ingest-data:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    healthcheck:
      # The stream touches the heartbeat file after every flush (default every 30 s).
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/xomtra-stream.heartbeat') < 180 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    depends_on:
      ducklake-init: { condition: service_completed_successfully }
    networks: [backend, egress]

volumes:
  lake-data:
