# HAmmond stack: Caddy (TLS) + MCP server + Postgres (DuckLake catalog) + SeaweedFS (S3).
# Usage: cp .env.example .env && edit && docker compose up -d
# Only Caddy is published (HTTPS); the MCP server is reachable only through it.

name: hammond

x-lake-env: &lake-env
  HAMMOND_LAKE_PG_HOST: postgres
  HAMMOND_LAKE_PG_DB: ${DUCKLAKE_PG_DB:-ducklake}
  HAMMOND_LAKE_PG_USER: ${DUCKLAKE_PG_USER:-ducklake}
  HAMMOND_LAKE_PG_PASSWORD: ${DUCKLAKE_PG_PASSWORD:?set DUCKLAKE_PG_PASSWORD in .env}
  HAMMOND_S3_ENDPOINT: seaweedfs:8333
  HAMMOND_S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
  HAMMOND_S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
  HAMMOND_S3_BUCKET: ${S3_BUCKET:-hammond}

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  postgres:
    <<: *hardening
    image: postgres:17-trixie@sha256:223efeb196329b55b3b9a13db144956411dbc18e727e59f681c3e0aede6475cf
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      DUCKLAKE_DB: ${DUCKLAKE_PG_DB:-ducklake}
      DUCKLAKE_USER: ${DUCKLAKE_PG_USER:-ducklake}
      DUCKLAKE_PASSWORD: ${DUCKLAKE_PG_PASSWORD:?set DUCKLAKE_PG_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/10-ducklake.sh:/docker-entrypoint-initdb.d/10-ducklake.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  seaweedfs:
    <<: *hardening
    image: chrislusf/seaweedfs:4.54@sha256:4b42c212543a0acd4c0e675215ecdcaf62a186ef98def76c7e12701871222d15
    entrypoint: ["/bin/sh", "/start.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs/start.sh:/start.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [backend]

  seaweedfs-init:
    image: chrislusf/seaweedfs:4.54@sha256:4b42c212543a0acd4c0e675215ecdcaf62a186ef98def76c7e12701871222d15
    entrypoint: ["/bin/sh", "/create-bucket.sh"]
    environment:
      S3_BUCKET: ${S3_BUCKET:-hammond}
    volumes:
      - ./seaweedfs/create-bucket.sh:/create-bucket.sh:ro
    depends_on:
      seaweedfs: { condition: service_healthy }
    restart: "no"
    networks: [backend]

  ducklake-init:
    image: ${HAMMOND_MCP_IMAGE:-ghcr.io/zettabyte-cz/hammond-mcp:main}
    entrypoint: ["python", "-m", "hacore.lake", "init"]
    environment: *lake-env
    depends_on:
      postgres: { condition: service_healthy }
      seaweedfs-init: { condition: service_completed_successfully }
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    networks: [backend]

  mcp:
    <<: *hardening
    image: ${HAMMOND_MCP_IMAGE:-ghcr.io/zettabyte-cz/hammond-mcp:main}
    environment:
      <<: *lake-env
      HAMMOND_AUTH_MODE: ${HAMMOND_AUTH_MODE:-entra}
      HAMMOND_BASE_URL: ${HAMMOND_BASE_URL:-}
      HAMMOND_ENTRA_TENANT_ID: ${HAMMOND_ENTRA_TENANT_ID:-}
      HAMMOND_ENTRA_CLIENT_ID: ${HAMMOND_ENTRA_CLIENT_ID:-}
      HAMMOND_ENTRA_CLIENT_SECRET: ${HAMMOND_ENTRA_CLIENT_SECRET:-}
      HAMMOND_ENTRA_REQUIRED_SCOPES: ${HAMMOND_ENTRA_REQUIRED_SCOPES:-mcp.access}
      HAMMOND_JWT_SIGNING_KEY: ${HAMMOND_JWT_SIGNING_KEY:-}
      HAMMOND_HA_URL: ${HAMMOND_HA_URL:-}
      HAMMOND_HA_TOKEN: ${HAMMOND_HA_TOKEN:-}
    volumes:
      - mcp-data:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    depends_on:
      ducklake-init: { condition: service_completed_successfully }
    networks: [backend, frontend]

  caddy:
    <<: *hardening
    image: ${HAMMOND_CADDY_IMAGE:-ghcr.io/zettabyte-cz/hammond-caddy:main}
    environment:
      HAMMOND_PUBLIC_HOST: ${HAMMOND_PUBLIC_HOST:?set HAMMOND_PUBLIC_HOST in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?set CLOUDFLARE_API_TOKEN in .env}
      CLAUDE_IP_RANGES: ${CLAUDE_IP_RANGES:?set CLAUDE_IP_RANGES in .env}
    ports:
      - "${HAMMOND_HTTPS_BIND:-0.0.0.0}:443:8443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    depends_on:
      mcp: { condition: service_healthy }
    networks: [frontend]

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  seaweedfs-data:
  mcp-data:

networks:
  backend:
    internal: true
  frontend:
