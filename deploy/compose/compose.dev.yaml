# Local development override: build the MCP image from source instead of pulling it.
#   docker compose -f compose.yaml -f compose.dev.yaml up -d --build
services:
  ducklake-init:
    build:
      context: ../..
      dockerfile: services/mcp-server/Dockerfile
    image: hammond-mcp:dev
  mcp:
    image: hammond-mcp:dev
    # Direct access for local tests, loopback only.
    ports:
      - "127.0.0.1:8000:8000"
  caddy:
    build:
      context: ../caddy
    image: hammond-caddy:dev
  ingest-stream:
    build:
      context: ../..
      dockerfile: services/ingest/Dockerfile
    image: hammond-ingest:dev
  dagster-daemon:
    image: hammond-ingest:dev
  dagster-webserver:
    image: hammond-ingest:dev
