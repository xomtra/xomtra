configuration:
  log_level:
    name: Log-Level
    description: Log-Level der xomtra-Dienste.
  states_retention_days:
    name: Zustandsverlauf (Tage)
    description: Wie viele Tage Zustandsverlauf im Lake bleiben.
  statistics_5min_retention_days:
    name: 5-Minuten-Statistiken (Tage)
    description: Wie viele Tage 5-Minuten-Statistiken im Lake bleiben.
  statistics_hour_retention_days:
    name: Stündliche Statistiken (Tage)
    description: Wie viele Tage stündliche Statistiken im Lake bleiben.
  mcp_url:
    name: MCP-Adresse
    description: >-
      MCP-Endpunkt, wie Clients in Ihrem Netz ihn erreichen, zum Beispiel
      http://homeassistant.local:8000/mcp. Leer: Die Verwaltung leitet ihn aus der
      Adresse ab, unter der Sie Home Assistant geöffnet haben.
  default_guidelines:
    name: Antwortregeln
    description: >-
      Dem Assistenten die Standardregeln für Antworten (Rolle, Umgang mit Daten, Takt)
      im gewählten Stil senden. Aus: Es bleiben nur die Grundregeln (keine Witze über
      Unfälle, Ausfälle oder Gefahr für Leben und Gesundheit; keine sexistischen,
      rassistischen, homophoben, fremdenfeindlichen, politischen oder religiösen Witze);
      ein aktuelles Thema von xomtra.com gilt weiter. Wirkt nach einem Neustart.
  answer_style:
    name: Antwortstil
    description: >-
      friendly: freundliche Antworten mit leichtem Humor (Standard). pub: sehr witzige,
      derbe und vulgäre Antworten wie von einem Kumpel in der Kneipe, passend zu Ihrer
      Sprache, Ihrem Land und Ihrer Kultur und persönlich nach dem, was der Assistent
      über Sie weiß; die Grundregeln gelten weiter. Wirkt nach einem Neustart.
network:
  8000/tcp: MCP-Endpunkt im LAN (persönliche Zugriffstokens)
