configuration:
  log_level:
    name: Log level
    description: Log level of the xomtra services.
  states_retention_days:
    name: State history (days)
    description: Days of state history kept in the lake.
  statistics_5min_retention_days:
    name: 5-minute statistics (days)
    description: Days of 5-minute statistics kept in the lake.
  statistics_hour_retention_days:
    name: Hourly statistics (days)
    description: Days of hourly statistics kept in the lake.
  mcp_url:
    name: MCP address
    description: >-
      MCP endpoint as clients in your network reach it, for example
      http://homeassistant.local:8000/mcp. Empty: the admin page guesses it from the
      address you opened Home Assistant on.
  default_guidelines:
    name: Answer guidelines
    description: >-
      Send the assistant the default rules for answering (role, work with data, tact) in
      the chosen style. Off: only the core rules stay (no jokes about accidents, outages
      or threats to life and health; no sexist, racist, homophobic, xenophobic,
      political or religious jokes); a current theme from xomtra.com still applies.
      Takes effect after a restart.
  answer_style:
    name: Answer style
    description: >-
      friendly: warm answers with light humour (default). pub: very funny, crude and
      vulgar answers, like a mate in the pub, fitted to your language, country and
      culture and personal from what the assistant knows about you; the core rules still
      apply. Takes effect after a restart.
network:
  8000/tcp: MCP endpoint in the LAN (personal access tokens)
