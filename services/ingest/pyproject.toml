[project]
name = "xomtra-ingest"
version = "0.5.0"
description = "Xomtra ingest: Home Assistant backfill, live state stream, SQLMesh transformations and Dagster jobs"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
  "hacore",
  "dagster>=1.13,<1.14",
  "dagster-webserver>=1.13,<1.14",
  "dagster-postgres>=0.29,<0.30",
  "sqlmesh>=0.236",
  "pydantic-settings>=2.10",
  # Run store of the built-in worker (also pulled in by dagster-postgres today).
  "psycopg2-binary>=2.9",
]

[project.scripts]
xomtra-ingest = "xomtra_ingest.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xomtra_ingest"]

[tool.uv.sources]
hacore = { workspace = true }
