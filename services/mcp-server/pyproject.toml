[project]
name = "hammond-mcp"
version = "0.1.0"
description = "HAmmond MCP server (FastMCP) with OAuth proxy to Microsoft Entra ID"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
  "hacore",
  "fastmcp>=3.0",
  "pydantic-settings>=2.10",
]

[project.scripts]
hammond-mcp = "hammond_mcp.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hammond_mcp"]

[tool.uv.sources]
hacore = { workspace = true }
