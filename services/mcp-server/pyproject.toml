[project]
name = "xomtra-mcp"
version = "0.7.1"
description = "xomtra MCP server (FastMCP) with OAuth proxy to Microsoft Entra ID"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
  "hacore",
  "fastmcp>=3.0",
  "pydantic-settings>=2.10",
  "psycopg2-binary>=2.9",
  "pyyaml>=6.0",
  "sqlglot>=27",
]

[project.scripts]
xomtra-mcp = "xomtra_mcp.__main__:main"
xomtra-admin = "xomtra_mcp.admin.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xomtra_mcp"]

[tool.uv.sources]
hacore = { workspace = true }
