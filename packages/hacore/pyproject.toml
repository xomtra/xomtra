[project]
name = "hacore"
version = "0.7.1"
description = "xomtra core: Home Assistant WebSocket client, registries and DuckLake access"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
  "websockets>=15.0",
  "duckdb>=1.4",
  "numpy>=2.2",
  # Home Assistant token stored by the admin GUI (ADR 077).
  "cryptography>=46",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hacore"]
