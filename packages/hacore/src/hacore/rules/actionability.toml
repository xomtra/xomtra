# Actionability rulebook of Xomtra (ADR 062 point 9, methodology 8.5, ADR 068).
#
# Public and versioned: every finding stores the version it was scored with
# (rules_version). Change the version (SemVer) with every change of a family or a rule.
#
# 1. A Home Assistant entity belongs to the FIRST family whose `match` fits it. A match
#    entry fits when every field it names fits (a list means any of): `domain`,
#    `device_class`, `unit`, `platform`, `keywords` (whole words or phrases in the
#    entity id or name, lower case, without diacritics). Entities that fit no family
#    are "other", which has no rules: their findings are "unclassified".
# 2. `rules.<family>.<finding type>` gives the category of a finding of that family:
#    fault, savings, automation, behaviour or none ("none" = the rule says the finding
#    calls for no action) and a priority 1-3. A relation takes the rule with the higher
#    priority of its two entities; equal priorities: fault > savings > automation >
#    behaviour > none.
# 3. `links` are physical relations that are trivial (T5): a correlation between these
#    families is expected and kept out of the ranking.
# 4. Every family has `examples`, checked in CI (each must land in its family).

version = "1.0.1"

# Helpers computed from other entities (T3: a helper and its source are trivial).
derived_platforms = [
  "template", "derivative", "integration", "statistics", "threshold", "utility_meter",
  "min_max", "filter", "trend", "group", "compensation", "history_stats",
]

links = [
  ["pv", "sun"],
  ["battery_storage", "grid"],
  ["pv", "grid"],
  ["heat_pump", "outdoor_temperature"],
]

[[family]]
name = "sun"
match = [
  { domain = ["sun"] },
  { device_class = ["irradiance"] },
  { keywords = ["irradiance", "solar radiation", "global radiation", "ozareni"] },
]
examples = [
  { entity_id = "sun.sun" },
  { entity_id = "sensor.roof_irradiance", device_class = "irradiance", unit = "W/m²" },
]

[[family]]
name = "pv"
match = [
  { device_class = ["power", "energy", "current", "voltage"], keywords = [
    "pv", "solar", "photovoltaic", "fve", "inverter", "stridac", "solax", "fronius",
    "wechselrichter", "zonnepanelen", "omvormer",
  ] },
]
examples = [
  { entity_id = "sensor.solar_power", device_class = "power", unit = "W" },
  { entity_id = "sensor.fve_vyroba_dnes", device_class = "energy", unit = "kWh" },
]

[[family]]
name = "battery_storage"
match = [
  { device_class = ["power", "energy", "current", "voltage", "battery"], keywords = [
    "home battery", "battery storage", "powerwall", "akumulator", "baterie fve",
    "house battery", "speicher", "thuisbatterij", "battery charge", "battery discharge",
    "battery power",
  ] },
]
examples = [
  { entity_id = "sensor.battery_power", device_class = "power", unit = "W" },
  { entity_id = "sensor.powerwall_charge", device_class = "battery", unit = "%" },
]

[[family]]
name = "grid"
match = [
  { device_class = ["power", "energy", "current", "voltage"], keywords = [
    "grid", "export", "import", "feed in", "pretok", "odber ze site", "dodavka do site",
    "netz", "einspeisung", "net", "teruglevering",
  ] },
]
examples = [
  { entity_id = "sensor.grid_export", device_class = "energy", unit = "kWh" },
  { entity_id = "sensor.pretok_vykon", device_class = "power", unit = "W" },
]

[[family]]
name = "air_quality"
match = [
  { device_class = [
    "carbon_dioxide", "carbon_monoxide", "volatile_organic_compounds",
    "volatile_organic_compounds_parts", "pm1", "pm25", "pm10", "aqi", "nitrogen_dioxide",
    "ozone",
  ] },
  # a gas or smoke detector; a gas meter (sensor) is energy
  { domain = ["binary_sensor"], device_class = ["gas", "smoke"] },
]
examples = [
  { entity_id = "sensor.office_co2", device_class = "carbon_dioxide", unit = "ppm" },
  { entity_id = "binary_sensor.boiler_room_gas", device_class = "gas" },
]

[[family]]
name = "heat_pump"
match = [
  { domain = ["climate", "water_heater"] },
  { keywords = [
    "heat pump", "heatpump", "tepelne cerpadlo", "tc", "waermepumpe", "warmepumpe",
    "warmtepomp", "compressor", "kompresor", "boiler", "bojler",
  ] },
]
examples = [
  { entity_id = "climate.living_room" },
  { entity_id = "sensor.heat_pump_power", device_class = "power", unit = "W" },
  { entity_id = "water_heater.bojler" },
]

[[family]]
name = "outdoor_temperature"
match = [
  { domain = ["weather"] },
  { device_class = ["temperature"], keywords = [
    "outdoor", "outside", "exterior", "venkovni", "venku", "aussen", "aussentemperatur",
    "buiten", "buitentemperatuur",
  ] },
]
examples = [
  { entity_id = "weather.home" },
  { entity_id = "sensor.outdoor_temperature", device_class = "temperature", unit = "°C" },
]

[[family]]
name = "temperature"
match = [{ device_class = ["temperature"] }, { unit = ["°C", "°F"] }]
examples = [{ entity_id = "sensor.kitchen_temperature", device_class = "temperature", unit = "°C" }]

[[family]]
name = "humidity"
match = [{ device_class = ["humidity", "moisture"] }]
examples = [
  { entity_id = "sensor.bathroom_humidity", device_class = "humidity", unit = "%" },
  { entity_id = "binary_sensor.leak_kitchen", device_class = "moisture" },
]

[[family]]
name = "power"
match = [{ device_class = ["power", "current", "apparent_power", "reactive_power"] }, { unit = ["W", "kW"] }]
examples = [{ entity_id = "sensor.fridge_power", device_class = "power", unit = "W" }]

[[family]]
name = "energy"
match = [{ device_class = ["energy", "gas", "water"] }, { unit = ["kWh", "Wh", "MWh", "m³"] }]
examples = [
  { entity_id = "sensor.house_energy", device_class = "energy", unit = "kWh" },
  { entity_id = "sensor.water_meter", device_class = "water", unit = "m³" },
  { entity_id = "sensor.gas_meter", device_class = "gas", unit = "m³" },
]

[[family]]
name = "sensor_battery"
match = [{ device_class = ["battery"] }]
examples = [{ entity_id = "sensor.door_sensor_battery", device_class = "battery", unit = "%" }]

[[family]]
name = "occupancy"
match = [
  { domain = ["person", "device_tracker", "zone"] },
  { device_class = ["motion", "occupancy", "presence"] },
]
examples = [
  { entity_id = "person.resident" },
  { entity_id = "binary_sensor.hall_motion", device_class = "motion" },
]

[[family]]
name = "opening"
match = [
  { domain = ["cover", "lock"] },
  { device_class = ["door", "window", "garage_door", "opening", "lock"] },
]
examples = [
  { entity_id = "binary_sensor.front_door", device_class = "door" },
  { entity_id = "cover.living_room_blinds" },
]

[[family]]
name = "light"
match = [{ domain = ["light"] }, { device_class = ["illuminance"] }]
examples = [
  { entity_id = "light.kitchen" },
  { entity_id = "sensor.hall_illuminance", device_class = "illuminance", unit = "lx" },
]

[[family]]
name = "network"
match = [
  { device_class = ["signal_strength", "data_rate", "data_size", "connectivity"] },
  { keywords = ["wifi", "router", "ping", "rssi", "uptime", "cpu", "memory", "bandwidth"] },
]
examples = [
  { entity_id = "sensor.router_download", device_class = "data_rate", unit = "Mbit/s" },
  { entity_id = "binary_sensor.internet", device_class = "connectivity" },
]

[[family]]
name = "appliance"
match = [
  { domain = ["switch", "fan", "vacuum", "media_player", "humidifier"] },
  { keywords = [
    "washer", "washing machine", "dishwasher", "dryer", "pracka", "mycka", "susicka",
    "waschmaschine", "spuelmaschine", "wasmachine", "vaatwasser", "oven", "trouba",
  ] },
]
examples = [
  { entity_id = "switch.coffee_maker" },
  { entity_id = "sensor.pracka_stav" },
]

[rules.sun]
anomaly = { category = "none", priority = 1 }
change_point = { category = "none", priority = 1 }
correlation = { category = "none", priority = 1 }

[rules.pv]
anomaly = { category = "fault", priority = 3 }
change_point = { category = "fault", priority = 3 }
correlation = { category = "savings", priority = 1 }

[rules.battery_storage]
anomaly = { category = "fault", priority = 3 }
change_point = { category = "fault", priority = 2 }
correlation = { category = "savings", priority = 2 }

[rules.grid]
anomaly = { category = "savings", priority = 2 }
change_point = { category = "savings", priority = 2 }
correlation = { category = "savings", priority = 1 }

[rules.heat_pump]
anomaly = { category = "fault", priority = 3 }
change_point = { category = "savings", priority = 3 }
correlation = { category = "savings", priority = 2 }

[rules.outdoor_temperature]
anomaly = { category = "fault", priority = 1 }
change_point = { category = "none", priority = 1 }
correlation = { category = "none", priority = 1 }

[rules.temperature]
anomaly = { category = "fault", priority = 2 }
change_point = { category = "savings", priority = 2 }
correlation = { category = "automation", priority = 1 }

[rules.humidity]
anomaly = { category = "fault", priority = 2 }
change_point = { category = "fault", priority = 1 }
correlation = { category = "automation", priority = 1 }

[rules.air_quality]
anomaly = { category = "behaviour", priority = 2 }
change_point = { category = "behaviour", priority = 1 }
correlation = { category = "automation", priority = 2 }

[rules.power]
anomaly = { category = "savings", priority = 3 }
change_point = { category = "savings", priority = 3 }
correlation = { category = "savings", priority = 2 }

[rules.energy]
anomaly = { category = "savings", priority = 3 }
change_point = { category = "savings", priority = 3 }
correlation = { category = "savings", priority = 2 }

[rules.sensor_battery]
anomaly = { category = "fault", priority = 3 }
change_point = { category = "fault", priority = 2 }
correlation = { category = "none", priority = 1 }

[rules.occupancy]
anomaly = { category = "behaviour", priority = 1 }
change_point = { category = "behaviour", priority = 1 }
correlation = { category = "automation", priority = 2 }

[rules.opening]
anomaly = { category = "behaviour", priority = 2 }
change_point = { category = "behaviour", priority = 1 }
correlation = { category = "automation", priority = 2 }

[rules.light]
anomaly = { category = "behaviour", priority = 1 }
change_point = { category = "savings", priority = 1 }
correlation = { category = "automation", priority = 2 }

[rules.network]
anomaly = { category = "fault", priority = 2 }
change_point = { category = "fault", priority = 1 }
correlation = { category = "none", priority = 1 }

[rules.appliance]
anomaly = { category = "fault", priority = 2 }
change_point = { category = "savings", priority = 2 }
correlation = { category = "automation", priority = 1 }
