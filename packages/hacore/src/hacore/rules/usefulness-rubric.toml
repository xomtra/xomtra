# Rubric and AI rater prompts for the usefulness rating (preregistration
# docs/evaluation/usefulness-prereg.md, sections 3 and 6; ADR 062 point 9, ADR 069).
#
# One source for the human form and the AI raters: the same wording of the scale, the
# trivial question and the categories. Change the version with every change of the
# wording; the pilot (20 findings outside the sample) may change the wording, never the
# scale. After the first rating of the sample the file is frozen; a change is a new
# version and a new gate (prereg section 4).

version = "1.0.0"

intro = """
You rate one finding of a smart-home analysis. The analysis looked at about 90 days of
hourly data from the sensors and meters of one home and reports relations between two
series (correlations), unusual episodes (anomalies) and lasting changes of level (change
points). Judge the finding from the point of view of the people who live in the home and
look after it. You see what the finding says, not how strong the statistics behind it
are; take it as true and judge whether it is worth their attention."""

answer = """
Answer with one JSON object and nothing else:
{"usefulness": 1-4, "trivial": true or false, "category": "fault" | "savings" |
"automation" | "behaviour" | "none", "reason": "one sentence"}"""

[usefulness]
question = "How useful is this finding to the household?"
levels = [
  { value = 1, label = "Nothing to learn", text = "Obvious, impossible to understand, or only about how the data were collected. The household learns nothing." },
  { value = 2, label = "Interesting, no action", text = "Not obvious and true to life, but there is nothing to check or do about it." },
  { value = 3, label = "Worth checking", text = "It may point to a fault, a waste, an opportunity or a habit worth a look; someone would check it." },
  { value = 4, label = "Act on it", text = "A concrete action follows (repair, a setting, an automation, a change of habit) with a likely benefit." },
]

[trivial]
question = "Is the finding trivial?"
text = """Yes when it follows from how the home or the measurement is built, whatever its
use: one device measured twice or by two of its own sensors, a value and a helper
computed from it, two sensors of the same quantity in one room, known physics (solar
output and sunshine, a heat pump and the outdoor temperature, a battery and the grid),
or series that drop out together because they come from one integration. Otherwise
no."""

[category]
question = "Which kind of action does the finding most call for?"
values = [
  { value = "fault", label = "fault", text = "Something may be broken, wrongly set or measuring wrong." },
  { value = "savings", label = "savings", text = "Energy or money could be saved." },
  { value = "automation", label = "automation", text = "Something could be automated or an automation adjusted." },
  { value = "behaviour", label = "behaviour", text = "A habit, comfort or routine of the household could change." },
  { value = "none", label = "none", text = "No action." },
]

# Plain-language description of a finding (hacore.public.rating_kit.describe). Only these
# placeholders exist: {a} {b} {how} {when} {lag} {start} {end} {day} {observed} {expected}.
[describe]
relation = "Relation: when '{a}' rises, '{b}' {how} {when} (hourly data over 90 days)."
rises = "rises"
falls = "falls"
later = "{lag} h later"
same_time = "at the same time"
anomaly = "Unusual episode: '{a}' from {start} to {end} UTC averaged {observed} where about {expected} is usual at those hours of the week."
change = "Lasting change: '{a}' changed its daily level on {day} from about {expected} to about {observed} and stayed there."
unknown = "unknown"
decimal = "."

# Context facts of the home or the data. Flags that are the method's own judgement
# (trivial, duplicate_suspect, same_device, indirect, common_factor) have no text and
# are never shown: raters judge triviality and structure themselves.
[flags]
same_area = "Both series are in the same room."
house_context = "One of the series describes the whole home (for example the weather or the main meter)."
weather = "The outdoor temperature was unusual at the same time."
short = "The episode lasted one hour."
level_shift = "The series changed its level earlier in the period."

# The human form: answers and how to fill them in.
[form]
yes = "yes"
no = "no"
help = "Fill in for every row: usefulness (1-4), trivial (yes/no), category (one of the words above) and, if you like, a note. A finding you cannot understand is a 1."

# Roles of the AI raters (prereg section 3): each role answers the same rubric, with the
# question of its role in mind. The AI consensus is the median of the roles.
[[role]]
name = "technician"
text = "You are a home technician. Ask yourself: does this point to a fault, a wrong setting or a data error?"

[[role]]
name = "owner"
text = "You are the owner of this home. Ask yourself: would I do something about this?"

[[role]]
name = "adviser"
text = "You are an energy adviser. Ask yourself: could this home save energy or money because of it?"
